[pytest]
testpaths = tests
# Test files stay inside the project (never the system temp folder); pytest empties
# .pytest_tmp at the start of every run. Run pytest from the project root.
# The batch tests are slow; they run only on request: pytest -m relay_bat
addopts = --basetemp=.pytest_tmp -m "not relay_bat"
markers =
    relay_bat: runs relay/ytx_relay.bat behind a dead proxy (Windows, 7-Zip on PATH)
